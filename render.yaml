# One-click deploy of the realtime relay on Render (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: warfare-realtime
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
